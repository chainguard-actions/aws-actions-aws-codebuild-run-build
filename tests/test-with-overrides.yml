name: Test with optional overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          project-name: test-project
          buildspec-override: buildspec-test.yml
          compute-type-override: BUILD_GENERAL1_SMALL
          environment-type-override: LINUX_CONTAINER
          image-override: aws/codebuild/standard:5.0
          image-pull-credentials-type-override: CODEBUILD
          env-vars-for-codebuild: MY_VAR,ANOTHER_VAR
          update-interval: '30'
          update-back-off: '1'
          disable-source-override: 'false'
          hide-cloudwatch-logs: 'false'
          disable-github-env-vars: 'false'
          stop-on-signals: 'SIGINT,SIGTERM'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
          MY_VAR: hello
          ANOTHER_VAR: world
        continue-on-error: true
      - name: Assert action ran (with or without real AWS)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run and either succeed or fail with an AWS error.
          # It should NOT crash due to invalid override input parsing.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with overrides (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
