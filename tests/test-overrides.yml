name: Test source and artifact override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-name: my-codebuild-project
          source-version-override: 'refs/heads/main'
          source-type-override: GITHUB
          source-location-override: 'https://github.com/example/repo.git'
          disable-source-override: 'true'
          disable-github-env-vars: 'true'
          artifacts-type-override: NO_ARTIFACTS
          stop-on-signals: 'SIGINT,SIGTERM'
          hide-cloudwatch-logs: 'false'
      - name: Assert action ran (may fail due to missing AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
