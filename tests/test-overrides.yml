name: Test override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-name: my-codebuild-project
          compute-type-override: BUILD_GENERAL1_SMALL
          environment-type-override: LINUX_CONTAINER
          image-override: aws/codebuild/standard:5.0
          image-pull-credentials-type-override: CODEBUILD
          disable-source-override: 'true'
          disable-github-env-vars: 'true'
      - name: Assert action ran (may fail without real AWS credentials)
        run: |
          echo "Action completed (with or without error due to missing AWS credentials)"
          echo "aws-build-id: ${{ steps.action.outputs.aws-build-id }}"
          echo "PASS"
