name: Test basic usage with common inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-name: my-codebuild-project
          buildspec-override: buildspec.yml
          compute-type-override: BUILD_GENERAL1_SMALL
          environment-type-override: LINUX_CONTAINER
          image-override: aws/codebuild/standard:5.0
          image-pull-credentials-type-override: CODEBUILD
          env-vars-for-codebuild: MY_VAR,ANOTHER_VAR
          update-interval: '30'
          update-back-off: '15'
          disable-source-override: 'false'
          hide-cloudwatch-logs: 'true'
      - name: Assert action ran (may fail due to missing AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
