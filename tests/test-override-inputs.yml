name: Test override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with override inputs (expect failure at AWS call)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_DEFAULT_REGION: us-east-1
        with:
          project-name: test-project
          buildspec-override: buildspec-custom.yml
          compute-type-override: BUILD_GENERAL1_SMALL
          environment-type-override: LINUX_CONTAINER
          image-override: aws/codebuild/standard:5.0
          disable-source-override: "false"
          hide-cloudwatch-logs: "true"
          disable-github-env-vars: "false"

      - name: Assert action failed (expected without real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (override inputs were accepted, failed at AWS call as expected)"
