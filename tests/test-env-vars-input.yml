name: Test env-vars-for-codebuild input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_VAR: hello-world
      ANOTHER_VAR: test-value
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with env-vars-for-codebuild (expect failure at AWS call)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_DEFAULT_REGION: us-east-1
          MY_VAR: hello-world
          ANOTHER_VAR: test-value
        with:
          project-name: test-project
          env-vars-for-codebuild: MY_VAR,ANOTHER_VAR

      - name: Assert action failed (expected without real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (env-vars input was accepted, failed at AWS call as expected)"
