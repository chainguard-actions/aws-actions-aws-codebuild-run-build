name: Test source override options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with source override disabled (expect failure due to missing AWS credentials)
        id: action-no-source-override
        uses: .
        continue-on-error: true
        with:
          project-name: test-project
          disable-source-override: 'true'
          source-version-override: 'refs/heads/main'
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: Assert action failed (not a crash)
        env:
          OUTCOME: ${{ steps.action-no-source-override.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid AWS credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with source override disabled"

      - name: Run action with buildspec override (expect failure due to missing AWS credentials)
        id: action-buildspec
        uses: .
        continue-on-error: true
        with:
          project-name: test-project
          buildspec-override: 'buildspec-custom.yml'
          disable-github-env-vars: 'true'
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: Assert buildspec override action failed (not a crash)
        env:
          OUTCOME: ${{ steps.action-buildspec.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid AWS credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with buildspec override"
