name: Test missing required project-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required project-name input (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # project-name is intentionally omitted — it is a required input
        # The action should fail with an input validation error

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required input project-name is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required input project-name is missing"
