name: Test artifacts-type-override and image-pull-credentials-type-override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-name: test-project
          artifacts-type-override: NO_ARTIFACTS
          image-pull-credentials-type-override: CODEBUILD
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - name: Assert action failed due to missing/invalid credentials (not input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid AWS credentials, not because of
          # missing or invalid inputs. This confirms the inputs were accepted.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid AWS credentials, inputs accepted)"
          else
            echo "FAIL: expected action to fail due to invalid credentials"
            exit 1
          fi
