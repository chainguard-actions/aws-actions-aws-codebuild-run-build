name: Test env-vars-for-codebuild and overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
      MY_CUSTOM_VAR: hello-world
      ANOTHER_VAR: test-value
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with env-vars and overrides (expect failure due to missing AWS credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          project-name: test-project
          env-vars-for-codebuild: MY_CUSTOM_VAR,ANOTHER_VAR
          compute-type-override: BUILD_GENERAL1_SMALL
          environment-type-override: LINUX_CONTAINER
          image-override: aws/codebuild/standard:5.0
          hide-cloudwatch-logs: 'true'
          disable-github-env-vars: 'false'
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: Assert action failed (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid AWS credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials and optional overrides"
