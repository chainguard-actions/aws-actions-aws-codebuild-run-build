name: Test source override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-name: my-codebuild-project
          source-version-override: 'refs/heads/main'
          source-type-override: GITHUB
          source-location-override: 'https://github.com/example/repo.git'
          artifacts-type-override: NO_ARTIFACTS
          stop-on-signals: 'SIGINT,SIGTERM'
      - name: Assert action ran (may fail without real AWS credentials)
        run: |
          echo "Action completed (with or without error due to missing AWS credentials)"
          echo "aws-build-id: ${{ steps.action.outputs.aws-build-id }}"
          echo "PASS"
