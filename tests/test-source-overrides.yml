name: Test source override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with source overrides (expect failure without real AWS credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          project-name: test-project
          disable-source-override: 'true'
          source-version-override: 'refs/heads/main'
          source-type-override: 'GITHUB'
          source-location-override: 'https://github.com/example/repo.git'
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: Assert action ran (not an input validation failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to AWS auth, not due to bad inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no real AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real AWS credentials present)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
