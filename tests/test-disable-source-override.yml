name: Test disable-source-override input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with disable-source-override=true (expect failure at AWS call)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_DEFAULT_REGION: us-east-1
        with:
          project-name: test-project
          disable-source-override: "true"

      - name: Assert action failed (expected without real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with disable-source-override=true (failed at AWS call as expected)"
