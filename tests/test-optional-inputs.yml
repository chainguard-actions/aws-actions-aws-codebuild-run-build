name: Test action with optional inputs (env-vars-for-codebuild, overrides)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test environment variables
        run: |
          echo "MY_TEST_VAR=hello-from-test" >> "$GITHUB_ENV"
          echo "ANOTHER_VAR=world" >> "$GITHUB_ENV"

      - name: Run action with optional inputs and fake credentials (expect failure at AWS call)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-west-2
          MY_TEST_VAR: hello-from-test
          ANOTHER_VAR: world
        with:
          project-name: nonexistent-test-project
          env-vars-for-codebuild: MY_TEST_VAR,ANOTHER_VAR
          disable-source-override: "true"
          disable-github-env-vars: "false"
          hide-cloudwatch-logs: "true"
          update-interval: "5"
          update-back-off: "1"

      - name: Assert action failed at AWS call (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed optional inputs and failed at AWS call stage"
