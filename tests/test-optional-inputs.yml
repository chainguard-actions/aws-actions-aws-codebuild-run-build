name: Test optional inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with optional inputs (expect failure at AWS API stage)
        id: action
        uses: .
        with:
          project-name: test-project
          buildspec-override: buildspec.yml
          compute-type-override: BUILD_GENERAL1_SMALL
          environment-type-override: LINUX_CONTAINER
          image-override: aws/codebuild/standard:5.0
          image-pull-credentials-type-override: CODEBUILD
          env-vars-for-codebuild: MY_VAR,ANOTHER_VAR
          update-interval: '30'
          update-back-off: '15'
          disable-source-override: 'false'
          hide-cloudwatch-logs: 'false'
          disable-github-env-vars: 'false'
          stop-on-signals: 'SIGINT,SIGTERM'
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_DEFAULT_REGION: us-east-1
          MY_VAR: hello
          ANOTHER_VAR: world
        continue-on-error: true

      - name: Assert action failed (expected - no real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AWS credentials are missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS API stage (not at input parsing)"
