name: Test source-type-override and source-location-override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with source-type-override and source-location-override
        id: action
        uses: .
        with:
          project-name: test-project
          source-type-override: GITHUB
          source-location-override: https://github.com/example/repo.git
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_DEFAULT_REGION: us-east-1
        continue-on-error: true

      - name: Assert action failed at AWS API stage (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AWS credentials are missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS API stage (not at input parsing), confirming source-type-override and source-location-override are accepted"
