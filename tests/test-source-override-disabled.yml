name: Test disable-source-override input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with source override disabled (expect failure at AWS API stage)
        id: action
        uses: .
        with:
          project-name: test-project
          disable-source-override: 'true'
          source-version-override: 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_DEFAULT_REGION: us-east-1
        continue-on-error: true

      - name: Assert action failed (expected - no real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AWS credentials are missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS API stage with disable-source-override=true"
