name: Test action with invalid AWS region fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake credentials and invalid region (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          project-name: nonexistent-test-project
          disable-source-override: "true"

      - name: Assert action failed (AWS error expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake AWS credentials"

      - name: Assert aws-build-id output is empty on failure
        env:
          BUILD_ID: ${{ steps.action.outputs.aws-build-id }}
        run: |
          echo "aws-build-id: '$BUILD_ID'"
          if [ -n "$BUILD_ID" ]; then
            echo "FAIL: expected aws-build-id to be empty on failure, but got: $BUILD_ID"
            exit 1
          fi
          echo "PASS: aws-build-id is empty as expected on failure"
